# Local development stack. Not a deployment artifact: production is ECS Fargate
# and RDS, defined in infra/.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sovereign
      POSTGRES_PASSWORD: sovereign
      POSTGRES_DB: sovereign
    ports:
      # 55432 on the host so this never fights with a local Postgres install.
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sovereign"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://sovereign:sovereign@db:5432/sovereign
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
