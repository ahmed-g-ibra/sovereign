name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agent:
    name: agent (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          # No third-party dependencies, so there is no go.sum and nothing to cache.
          cache: false

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      - name: build
        run: go build -o /dev/null ./cmd/probe

      # The agent has to run on a Raspberry Pi on someone's home connection.
      # Catching a broken ARM build here is cheaper than finding out from a
      # volunteer who then never tries again.
      - name: cross-compile for probe hardware
        run: |
          GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/probe
          GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/probe

  api:
    name: api (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sovereign
          POSTGRES_PASSWORD: sovereign
          POSTGRES_DB: sovereign
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sovereign"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://sovereign:sovereign@localhost:5432/sovereign_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: install
        run: uv sync --extra dev

      - name: knowledge base
        run: uv run sovereign knowledge check

      - name: test
        run: uv run pytest -q

  web:
    name: web (astro)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # --omit=dev skips wrangler, which only a deploy needs.
      - name: install
        run: npm ci --omit=dev

      # Asserts the browser advisor still agrees with the Python one.
      - name: test
        run: npm test

      # Builds with no snapshot present, which is what a fresh clone looks
      # like. Every page must render an empty state rather than fail. The
      # post-build check also asserts the noindex meta tag, the X-Robots-Tag
      # header and robots.txt all agree with the indexing flag.
      - name: build unlisted (default)
        run: npm run build

      - name: build indexable
        run: PUBLIC_INDEXABLE=true npm run build

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [bootstrap, aws]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"

      - name: fmt
        run: terraform -chdir=infra/${{ matrix.stack }} fmt -check -recursive

      # -backend=false validates the configuration without needing credentials
      # or the state bucket, so this runs on every pull request including forks.
      - name: init
        run: terraform -chdir=infra/${{ matrix.stack }} init -backend=false

      - name: validate
        run: terraform -chdir=infra/${{ matrix.stack }} validate

